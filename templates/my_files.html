<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Files - Secure Wallet</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

</head>


<body>

    <h1>🔐 Secure Wallet</h1>

    <h2>📂 My Secure Files</h2>


    {% if files %}

        <table border="1" cellpadding="10">

            <tr>

                <th>File Name</th>

                <th>SHA-256 Hash</th>

                <th>Uploaded At</th>

                <th>Action</th>

            </tr>


            {% for file in files %}

            <tr>

                <td>
                    {{ file.original_filename }}
                </td>


                <td>
                    {{ file.file_hash }}
                </td>


                <td>
                    {{ file.uploaded_at }}
                </td>


                <td>

                    <a href="/download/{{ file.id }}">

                        <button type="button">
                            🔓 Download
                        </button>

                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>


    {% else %}

        <p>
            No files uploaded yet.
        </p>

    {% endif %}


    <br>


    <a href="/dashboard">
        ← Back to Dashboard
    </a>

</body>

</html>
