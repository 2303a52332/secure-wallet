<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Secure Wallet</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🔐
            </div>

            <h1>Secure Wallet</h1>

            <p class="auth-subtitle">
                Secure File Protection System
            </p>

            <h2>Welcome Back</h2>

            <p class="auth-description">
                Login to access your secure files.
            </p>

            <form method="POST">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    class="auth-button"
                >
                    🔓 Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
