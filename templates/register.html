<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Secure Wallet</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                🔐
            </div>


            <h1>
                Secure Wallet
            </h1>


            <p class="auth-subtitle">
                Secure File Protection System
            </p>


            <h2>
                Create Account
            </h2>


            <p class="auth-description">
                Create your secure wallet account.
            </p>


            <form method="POST">


                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <label for="confirm_password">
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    🔐 Create Account
                </button>


            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>


            <a
                href="/"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>

</body>

</html>
