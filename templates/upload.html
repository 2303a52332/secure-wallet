<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload File - Secure Wallet</title>
</head>

<body>

    <h1>🔐 Secure Wallet</h1>

    <h2>📤 Upload Secure File</h2>

    <form method="POST" enctype="multipart/form-data">

        <label>Select a file:</label>

        <br><br>

        <input
            type="file"
            name="file"
            required
        >

        <br><br>

        <button type="submit">
            🔒 Encrypt & Upload
        </button>

    </form>

    <br>

    <a href="/dashboard">
        ← Back to Dashboard
    </a>

</body>

</html>
